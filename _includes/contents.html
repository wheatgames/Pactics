{% assign sections = content | split: '<h2 id="' %}
<ol class="section-list">
  {% for section in sections offset:1 %}
  {% assign section_id = section | split: '"' | first %}
  {% assign section_title = section | split: '</h2>' | first | prepend: '<h2 id="' | strip_html | strip %}
  <li><a href="#{{ section_id | escape }}">{{ section_title | escape }}</a></li>
  {% endfor %}
</ol>
